<!-- MODALE INSERIMENTO / MODIFICA ALIMENTO CON AUTOCOMPLETE -->
    <div id="modalAlimento" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-xl space-y-4">
        <h3 id="modalAlimentoTitolo" class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span>➕</span> Aggiungi Alimento
        </h3>
        
        <!-- Input nascosto per distinguere se stiamo modificando o creando -->
        <input type="hidden" id="editAlimentoId">

        <div class="space-y-3">
          <!-- Campo Nome con Container Suggerimenti Autocomplete -->
          <div class="relative">
            <label class="block text-xs font-medium text-gray-700 mb-1">Nome Alimento</label>
            <input type="text" id="alim_nome" placeholder="Es. Riso basmati, Petto di pollo..." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm" autocomplete="off">
            <div id="suggerimentiAlimenti" class="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto hidden z-50 divide-y divide-gray-50"></div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Categoria</label>
            <select id="alim_categoria" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
              <option value="Proteine">Proteine</option>
              <option value="Carboidrati">Carboidrati</option>
              <option value="Grassi">Grassi</option>
              <option value="Verdura">Verdura</option>
              <option value="Frutta">Frutta</option>
              <option value="Generico">Generico</option>
            </select>
          </div>

          <!-- AGGIUNTA: Gestione del Peso (Variabile o Fisso / Unità di Misura) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="alim_unita" class="block text-xs font-medium text-gray-700 mb-1">Gestione Peso</label>
              <select id="alim_unita" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-white">
                <option value="g">Peso Variabile (grammi)</option>
                <option value="pz">Peso Fisso (a pezzi)</option>
                <option value="porzione">Peso Fisso (a porzione)</option>
              </select>
            </div>
            
            <div id="wrapperPesoUnita" class="hidden">
              <label id="labelPesoUnita" for="alim_peso_unita" class="block text-xs font-medium text-gray-700 mb-1">Peso medio pezzo (g)</label>
              <input type="number" step="any" id="alim_peso_unita" placeholder="Es. 60" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Calorie (per 100g)</label>
              <input type="number" step="0.1" id="alim_kcal" placeholder="kcal" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Proteine (g)</label>
              <input type="number" step="0.1" id="alim_prot" placeholder="g" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Carboidrati (g)</label>
              <input type="number" step="0.1" id="alim_carbo" placeholder="g" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Grassi (g)</label>
              <input type="number" step="0.1" id="alim_grassi" placeholder="g" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnChiudiModalAlimento" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition">Annulla</button>
          <button type="button" id="btnSalvaAlimento" class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition">Salva Alimento</button>
        </div>
      </div>
    </div>
